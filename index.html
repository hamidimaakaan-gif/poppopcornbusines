<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poppopcorn.com - امپراطوری پاپ‌کورن</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:linear-gradient(270deg,#ff6a00,#ffa500,#ffcf70,#fff8f0,#ff8c00);background-size:400% 400%;animation:bgMove 12s ease infinite;min-height:100vh;color:#4a2c00;overflow-x:hidden}
@keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.float-bg{position:fixed;top:-50px;font-size:2rem;opacity:.5;pointer-events:none;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.container{max-width:1100px;margin:0 auto;padding:20px;padding-bottom:80px;position:relative;z-index:2}
header{text-align:center;background:rgba(255,255,255,.95);border-radius:25px;padding:20px;margin-bottom:15px;border:4px solid #ff8c00;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:slideDown .7s ease}
@keyframes slideDown{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
header h1{font-size:2.2rem;color:#e65c00;text-shadow:2px 2px 0 #ffe0b3;animation:glow 2s infinite alternate}
@keyframes glow{from{text-shadow:2px 2px 0 #ffe0b3}to{text-shadow:2px 2px 15px #ff8c00}}
header h1 span{font-size:1rem;color:#999;display:block;direction:ltr}
.rank-bar{background:#fff;border-radius:15px;padding:12px 18px;margin-bottom:15px;border:2px solid #ffb347;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.rank-bar .lvl{font-weight:bold;color:#e65c00;font-size:1.1rem}
.progress{height:12px;background:#ffe0b3;border-radius:20px;margin-top:8px;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,#ff8c00,#ffd54f);border-radius:20px;transition:width .4s;animation:shine 1.5s infinite}
@keyframes shine{0%{filter:brightness(1)}50%{filter:brightness(1.25)}100%{filter:brightness(1)}}
.story{background:#fff;border-radius:15px;padding:14px 18px;margin-bottom:15px;border-right:6px solid #e65c00;line-height:1.9;animation:fadeIn 1s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.stats{display:flex;gap:12px;justify-content:center;margin-bottom:15px;flex-wrap:wrap;position:sticky;top:10px;z-index:10}
.stat{background:#fff;border-radius:15px;padding:12px 22px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.15);min-width:135px;border:2px solid #ffb347;transition:transform .2s}
.stat.bump{transform:scale(1.15) rotate(-2deg)}
.stat b{font-size:1.6rem;color:#e65c00;display:block}
.stat small{color:#888}
#combo{position:fixed;top:15px;left:15px;background:#4a2c00;color:#ffd54f;font-weight:bold;padding:10px 18px;border-radius:30px;font-size:1.1rem;display:none;z-index:50;box-shadow:0 5px 20px rgba(0,0,0,.3);animation:comboPop .3s}
@keyframes comboPop{from{transform:scale(.5)}to{transform:scale(1)}}
.game-area{background:rgba(255,255,255,.97);border-radius:30px;padding:30px 20px;text-align:center;border:4px solid #ff8c00;margin-bottom:15px;box-shadow:0 15px 40px rgba(230,92,0,.25);position:relative;overflow:hidden}
.game-area::before{content:'✨';position:absolute;font-size:5rem;opacity:.07;top:10px;left:20px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#cornBtn{font-size:9rem;background:none;border:none;cursor:pointer;user-select:none;transition:transform .08s;filter:drop-shadow(0 12px 18px rgba(230,92,0,.4));animation:idle 2s ease-in-out infinite}
@keyframes idle{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.05) rotate(2deg)}}
#cornBtn:active{transform:scale(.82) rotate(-8deg)}
.hint{color:#e65c00;font-weight:bold;margin-top:10px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}
.fly{position:fixed;font-weight:bold;pointer-events:none;z-index:99;animation:flyUp 1s forwards;font-size:1.4rem;text-shadow:1px 1px 0 #fff}
@keyframes flyUp{to{transform:translateY(-160px) scale(1.4) rotate(10deg);opacity:0}}
.particle{position:fixed;font-size:1.8rem;pointer-events:none;z-index:99;animation:boom 1s ease-out forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(300deg);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-1deg)}75%{transform:translateX(10px) rotate(1deg)}}
.shop h2{text-align:center;color:#fff;background:linear-gradient(90deg,#e65c00,#ff8c00);border-radius:15px;padding:14px;margin-bottom:5px;box-shadow:0 5px 15px rgba(0,0,0,.2);animation:fadeIn .8s}
.shop-sub{text-align:center;color:#fff;margin-bottom:10px;font-size:.9rem;text-shadow:1px 1px 3px rgba(0,0,0,.3)}
.cat{background:#4a2c00;color:#ffd54f;border-radius:10px;padding:9px;margin:18px 0 12px;text-align:center;font-weight:bold;letter-spacing:1px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:#fff;border-radius:18px;padding:16px;text-align:center;border:2px solid #ffb347;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .25s,box-shadow .25s;animation:cardIn .5s ease backwards}
@keyframes cardIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 12px 25px rgba(230,92,0,.3)}
.card .emoji{font-size:2.8rem;display:inline-block;animation:wobble 3s ease-in-out infinite}
